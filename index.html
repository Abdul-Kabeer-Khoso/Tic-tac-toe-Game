<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav>
        <h3>Tic-Tac-Toe</h3>
    </nav>

    <div class="bodyContainer">

        <div class="mainContainer">

            <div class="gameContainer">

                    <div class="box border-topLeft-radius"><p class="boxtext"></p></div>
                    <div class="box"><p class="boxtext"></p></div>
                    <div class="box border-topRight-radius"><p class="boxtext"></p></div>
                    <div class="box"><p class="boxtext"></p></div>
                    <div class="box"><p class="boxtext"></p></div>
                    <div class="box"><p class="boxtext"></p></div>
                    <div class="box border-bottomLeft-radius"><p class="boxtext"></p></div>
                    <div class="box"><p class="boxtext"></p></div>
                    <div class="box border-bottomRight-radius"><p class="boxtext"></p></div>

            </div>

            <div class="infoContainer">

                    <div class="textAndBtn"> 

                    <div class="welcomeText"><h3>WELCOME TO TIC TAC TOE</h3></div>
                    <div class="turn"><h3>turn for X</h3></div>
                    <button class="resetButton">Reset</button>

                  

                    </div>


            </div>

            <div class="WinImage resultImage"><img src="won.gif"></div>
            <div class="LoseImage resultImage"><img src="losegame.gif"></div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
